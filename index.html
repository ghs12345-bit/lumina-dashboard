.footer { text-align: center; padding: 20px; font-size: 12px; color: #999; }

function fmtInt(val) {
  if (val === null || val === undefined || isNaN(val)) return '—';

function fmt2(val) {

function buildTooltip(dateStr, seriesList) {
  let html = '<div style="font-weight:600;margin-bottom:6px;font-size:14px;">' + dateStr + '</div>';
  seriesList.forEach(function(s) {
    html += '<div style="display:flex;align-items:center;margin:3px 0;">';
    html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + s.color + ';margin-right:8px;"></span>';
    html += '<span style="flex:1;">' + s.name + '</span>';
    html += '<span style="font-weight:600;margin-left:12px;">' + s.value + '</span>';
    html += '</div>';
  });
  return html;
}
