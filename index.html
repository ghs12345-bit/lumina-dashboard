function fmtInt(val) {
  if (val === null || val === undefined || isNaN(val)) return '—';
  return Math.round(val).toLocaleString('en-US');
}

function fmt2(val) {
  if (val === null || val === undefined || isNaN(val)) return '—';
  return val.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function buildTooltip(dateStr, seriesList) {
  // Filter out null entries before rendering
  var validSeries = seriesList.filter(function(s) { return s.value !== null && s.value !== undefined && !isNaN(s.value); });
  if (validSeries.length === 0) return '<div style="font-weight:600;">' + dateStr + '</div><div style="color:#999;font-size:12px;">无数据</div>';
  var html = '<div style="font-weight:600;margin-bottom:6px;font-size:14px;">' + dateStr + '</div>';
  validSeries.forEach(function(s) {
    html += '<div style="display:flex;align-items:center;margin:3px 0;">';
    html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + s.color + ';margin-right:8px;"></span>';
    html += '<span style="flex:1;">' + s.name + '</span>';
    html += '<span style="font-weight:600;margin-left:12px;">' + s.value + '</span>';
    html += '</div>';
  });
  return html;
}

function getCurrencyPrefix(seriesName) {
  if (seriesName.indexOf('TSX') >= 0) return 'C$';
  if (seriesName.indexOf('WSE') >= 0) return 'zł';
  return '$';
}
