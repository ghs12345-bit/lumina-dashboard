function fmtInt(val) {
  if (val === null || val === undefined || isNaN(val)) return '—';
  return Math.round(val).toLocaleString('en-US');
}

function fmt2(val) {
  if (val === null || val === undefined || isNaN(val)) return '—';
  return val.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function buildTooltip(dateStr, seriesList) {
  let html = '<div style="font-weight:600;margin-bottom:6px;font-size:14px;">' + dateStr + '</div>';
  seriesList.forEach(function(s) {
    html += '<div style="display:flex;align-items:center;margin:3px 0;">';
    html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + s.color + ';margin-right:8px;"></span>';
    html += '<span style="flex:1;">' + s.name + '</span>';
    html += '<span style="font-weight:600;margin-left:12px;">' + s.value + '</span>';
    html += '</div>';
  });
  return html;
}

  const data = DASHBOARD_DATA;

  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');

  const dates = records.map(r => r.Date_str);
  const tsxData = records.map(r => r.TSX);
  const wseData = records.map(r => r.WSE);
  const silverData = records.map(r => r.Silver);
  const copperData = records.map(r => r.Copper);

  const chart = echarts.init(document.getElementById('main-chart'));
  chart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: function(params) {
        const dateStr = params[0].axisValue;
        const list = params.map(p => {
          let prefix = '$';
          if (p.seriesName === 'TSX 股价') prefix = 'C$';
          if (p.seriesName === 'WSE 股价') prefix = 'zł';
          return { name: p.seriesName, value: prefix + fmt2(p.value), color: p.color };
        });
        return buildTooltip(dateStr, list);
      }
    },
    legend: { data: ['TSX 股价', 'WSE 股价', '银价', '铜价'], top: 8 },
    grid: { left: '14%', right: '16%', top: '15%', bottom: '10%' },

      type: 'category',
      data: dates,
      axisLabel: { rotate: 45, fontSize: 10, interval: 6 }
    },
    yAxis: [
      {
        type: 'value', name: 'TSX 股价 (C$)', position: 'left', offset: 0,
        min: axis.tsx.min, max: axis.tsx.max,

      },
      {
        type: 'value', name: 'WSE 股价 (zł)', position: 'left', offset: 70,

        axisLine: { lineStyle: { color: '#2e7d32' } },
        axisLabel: { color: '#2e7d32', formatter: function(v) { return fmtInt(v); } },
        splitLine: { show: false }
      },
      {
        type: 'value', name: '银价 ($)', position: 'right', offset: 0,
        min: axis.silver.min, max: axis.silver.max,
        axisLine: { lineStyle: { color: '#78909c' } },
        axisLabel: { color: '#78909c', formatter: function(v) { return fmtInt(v); } },
        splitLine: { show: false }
      },
      {
        type: 'value', name: '铜价 ($)', position: 'right', offset: 70,
        min: axis.copper.min, max: axis.copper.max,
        axisLine: { lineStyle: { color: '#e65100' } },
        axisLabel: { color: '#e65100', formatter: function(v) { return fmtInt(v); } },
        splitLine: { show: false }
      }

    series: [

        name: 'TSX 股价', type: 'line', data: tsxData,
