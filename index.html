function initDashboard() {
  const data = DASHBOARD_DATA;
  const stats = data.stats;
  const axis = data.axis_ranges;

  // 统计卡片
  document.getElementById('copper-price').textContent = '$' + stats.copper_latest_price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  document.getElementById('copper-date').textContent = '更新于 ' + stats.copper_latest_date;
  document.getElementById('tsx-price').textContent = 'CAD$' + stats.tsx_latest_close.toFixed(2);
  document.getElementById('tsx-date').textContent = '更新于 ' + stats.tsx_latest_date;
  document.getElementById('wse-price').textContent = 'PLN ' + stats.wse_latest_close.toFixed(2);
  document.getElementById('wse-date').textContent = '更新于 ' + stats.wse_latest_date;
  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');

  const tsxDates = data.tsx.map(d => d.Date_str);
  const tsxPrices = data.tsx.map(d => d.Close);
  const tsxCopper = data.tsx.map(d => d.Price);

  const wseDates = data.wse.map(d => d.Date_str);
  const wsePrices = data.wse.map(d => d.Close);
  const wseCopper = data.wse.map(d => d.Price);

  function findStartIndex(dates, startDate) {
    for (let i = 0; i < dates.length; i++) {
      if (dates[i] >= startDate) return i;
    }
    return 0;
  }

  const tsxStartIdx = findStartIndex(tsxDates, stats.tsx_first_date);
  const wseStartIdx = findStartIndex(wseDates, stats.wse_first_date);
  const tsxStartPct = (tsxStartIdx / tsxDates.length) * 100;
  const wseStartPct = (wseStartIdx / wseDates.length) * 100;

  // TSX双轴图表 - 铜价Y轴用tsx_copper范围
  const chartTsx = echarts.init(document.getElementById('chart-tsx'));
  chartTsx.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    legend: { data: ['TSX 收盘价 (CAD)', 'LME 铜价 (USD/吨)'], top: 0 },
    grid: { left: '3%', right: '3%', bottom: '10%', top: '15%', containLabel: true },
    dataZoom: [
      { type: 'inside', start: tsxStartPct, end: 100 },
      { type: 'slider', start: tsxStartPct, end: 100, bottom: 0 }
    ],
    xAxis: {
      type: 'category',
      data: tsxDates,
      axisLabel: { rotate: 45, fontSize: 10 }
    },
    yAxis: [
      {
        type: 'value',
        name: 'TSX 股价 (CAD)',
        position: 'left',
        min: axis.tsx.min,
        max: axis.tsx.max,
        axisLine: { lineStyle: { color: '#1565c0' } },
        axisLabel: { color: '#1565c0' },
        splitLine: { lineStyle: { color: '#eee' } }
      },
      {
        type: 'value',
        name: 'LME 铜价 (USD/吨)',
        position: 'right',
        min: axis.tsx_copper.min,
        max: axis.tsx_copper.max,
        axisLine: { lineStyle: { color: '#e65100' } },
        axisLabel: { color: '#e65100', formatter: v => '$' + (v/1000).toFixed(1) + 'K' },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: 'TSX 收盘价 (CAD)',
        type: 'line',
        yAxisIndex: 0,
        data: tsxPrices,
        smooth: true,
        symbol: 'none',
        lineStyle: { color: '#1565c0', width: 2.5 },
        itemStyle: { color: '#1565c0' },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [
          { offset: 0, color: 'rgba(21,101,192,0.15)' },
          { offset: 1, color: 'rgba(21,101,192,0.01)' }
        ]}}
      },
      {
        name: 'LME 铜价 (USD/吨)',
        type: 'line',
        yAxisIndex: 1,
        data: tsxCopper,
        smooth: true,
        symbol: 'none',
        lineStyle: { color: '#e65100', width: 2, type: 'dashed' },
        itemStyle: { color: '#e65100' }
      }
    ]
  });

  // WSE双轴图表 - 铜价Y轴用wse_copper范围
  const chartWse = echarts.init(document.getElementById('chart-wse'));
  chartWse.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    legend: { data: ['WSE 收盘价 (PLN)', 'LME 铜价 (USD/吨)'], top: 0 },
    grid: { left: '3%', right: '3%', bottom: '10%', top: '15%', containLabel: true },
    dataZoom: [
      { type: 'inside', start: wseStartPct, end: 100 },
      { type: 'slider', start: wseStartPct, end: 100, bottom: 0 }
    ],
    xAxis: {
      type: 'category',
      data: wseDates,
      axisLabel: { rotate: 45, fontSize: 10 }
    },
    yAxis: [
      {
        type: 'value',
        name: 'WSE 股价 (PLN)',
        position: 'left',
        min: axis.wse.min,
        max: axis.wse.max,
        axisLine: { lineStyle: { color: '#2e7d32' } },
        axisLabel: { color: '#2e7d32' },
        splitLine: { lineStyle: { color: '#eee' } }
      },
      {
        type: 'value',
        name: 'LME 铜价 (USD/吨)',
        position: 'right',
        min: axis.wse_copper.min,
        max: axis.wse_copper.max,
        axisLine: { lineStyle: { color: '#e65100' } },
        axisLabel: { color: '#e65100', formatter: v => '$' + (v/1000).toFixed(1) + 'K' },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: 'WSE 收盘价 (PLN)',
        type: 'line',
        yAxisIndex: 0,
        data: wsePrices,
        smooth: true,
        symbol: 'none',
        lineStyle: { color: '#2e7d32', width: 2.5 },
        itemStyle: { color: '#2e7d32' },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [
          { offset: 0, color: 'rgba(46,125,50,0.15)' },
          { offset: 1, color: 'rgba(46,125,50,0.01)' }
        ]}}
      },
      {
        name: 'LME 铜价 (USD/吨)',
        type: 'line',

        smooth: true,
        symbol: 'none',
        lineStyle: { color: '#e65100', width: 2, type: 'dashed' },
        itemStyle: { color: '#e65100' }
      }
    ]
  });

  window.addEventListener('resize', () => {
    chartTsx.resize();
    chartWse.resize();
  });
}
